{% extends "layout/base.html" %}

{% block content %}

<div class="min-h-screen bg-gradient-to-br from-slate-100 to-slate-200 py-8 px-3">

    <!-- Main Card -->
    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">

                <div class="w-full text-center">
                    <h2 class="text-2xl md:text-3xl font-bold text-black  border-red-600 bg-green-700">
                        Customer Entry Form
                    </h2>
                </div>
        <!-- Form Section -->
        <div class="p-4 md:p-6">
            

            <form class="grid grid-cols-1 md:grid-cols-2 gap-5" method="post" action="{% url 'save_customer' %}">
                {% csrf_token %}

                <!-- Customer ID -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Customer ID
                    </label>

                    <div class="flex gap-2">

                        <input
                            type="text"
                            placeholder="Auto Generated"
                            name="customer_id"
                            value="{{ customer.customer_id|default:'' }}"
                            {% if customer %}readonly{% endif %}
                            class="w-full border border-gray-300 bg-gray-50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none transition">
                    </div>

                </div>

                <!-- Customer Name -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        name="customer_name"
                        placeholder="Enter Customer Name"
                        value="{{ customer.customer_name|default:'' }}"
                        class="w-full border border-gray-300 bg-gray-50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none transition">

                </div>

                <!-- Phone -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone_number"
                        placeholder="03XX-XXXXXXX"
                        value="{{ customer.phone_number|default:'' }}"
                        class="w-full border border-gray-300 bg-gray-50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none transition">

                </div>

                <!-- Email -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="example@gmail.com"
                        value="{{ customer.email|default:'' }}"
                        class="w-full border border-gray-300 bg-gray-50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none transition">

                </div>

                <!-- Customer Type -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Customer Type
                    </label>

                    <select
                    name="customer_type"
                        class="w-full border border-gray-300 bg-gray-50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none transition">

                        <option value="">Select Type</option>
                        <option value="Local" {% if customer.customer_type == 'Local' %}selected{% endif %}>Local</option>
                        <option value="Export" {% if customer.customer_type == 'Export' %}selected{% endif %}>Export</option>

                    </select>

                </div>

                <!-- Address -->
                <div class="md:col-span-2">

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Address
                    </label>

                    <textarea
                        rows="4"
                        name="address"
                        placeholder="Enter Full Address"
                        class="w-full border border-gray-300 bg-gray-50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none resize-none transition">{{ customer.address|default:'' }}</textarea>

                </div>

            

            <!-- Buttons -->
            <div class="flex flex-wrap justify-center lg:justify-end gap-3 mt-8 border-t pt-6">
                
                <!-- Save Button - Always Show -->
                <button type="submit"
                    formaction="{% url 'save_customer' %}"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl shadow-md hover:scale-105 transition duration-200">
                    Save
                </button>

                <!-- Find Button - Always Show -->
                <button type="submit"
                    formaction="{% url 'find_customer' %}"
                    class="bg-indigo-600 hover:bg-indigo-700 text-green-700 px-6 py-3 rounded-xl shadow-md hover:scale-105 transition duration-200">
                    Find
                </button>

                <!-- View Button - Only Show When Customer Exists -->
                {% if customer %}
                <button type="button"
                    onclick="window.location='{% url "view_customer" customer.id %}'"
                    class="bg-amber-500 hover:bg-amber-600 text-black px-6 py-3 rounded-xl shadow-md hover:scale-105 transition duration-200">
                    View
                </button>
                {% endif %}

                <!-- Update Button - Only Show When Customer Exists -->
                {% if customer %}
                <button type="submit"
                    formaction="{% url 'update_customer' customer.id %}"
                    class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl shadow-md hover:scale-105 transition duration-200">
                    Update
                </button>
                {% endif %}

                <!-- Delete Button - Only Show When Customer Exists -->
                {% if customer %}
                <button type="button"
                    onclick="if(confirm('Are you sure you want to delete this customer?')) { window.location='{% url "delete_customer" customer.id %}'; }"
                    class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl shadow-md hover:scale-105 transition duration-200">
                    Delete
                </button>
                {% endif %}

                <!-- Refresh Button - Always Show -->
                <button type="reset"
                    class="bg-gray-700 hover:bg-gray-800 text-white px-6 py-3 rounded-xl shadow-md hover:scale-105 transition duration-200">
                    Refresh
                </button>

            </div>
            </form>
        </div>

    </div>

</div>

{% endblock %}
