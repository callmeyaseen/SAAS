<!DOCTYPE html>
<html>
<head>
    <title>ERP Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="min-h-screen flex items-center justify-center px-4">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl">

        <h2 class="text-3xl font-bold text-center mb-8">
            Textile ERP Login
        </h2>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-100 text-red-700 px-4 py-3 rounded-lg mb-4 text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-base font-medium mb-2">
                    Username
                </label>

                <input 
                    type="text" 
                    name="username" 
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-base focus:ring-2 focus:ring-blue-500 outline-none"
                >
            </div>

            <div>
                <label class="block text-base font-medium mb-2">
                    Password
                </label>

                <input 
                    type="password" 
                    name="password" 
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-base focus:ring-2 focus:ring-blue-500 outline-none"
                >
            </div>

            <button 
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-blue-700 transition"
            >
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
